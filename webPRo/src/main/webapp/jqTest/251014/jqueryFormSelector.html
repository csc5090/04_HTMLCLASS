<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<script src="../../js/jquery-3.7.1.js"></script>
<script>
/* 모든 input요소 테두리 - lime
    모든 input요소 배경색 - pink
    Input type=button인 요소 배경색 - black
    Input type=button인 요소 글자색 - white
    Button요소와 input type=button인 요소 배경색 - lightblue
    type=submit인 요소 배경색 - green
    type=reset인 요소 배경색 - yellow
    type=text, password인 요소 테두리 - blue
    type=file, image인 요소 테두리 - 2px solid red
 */


$(function(){
	$(":input").css("border-color", "lime").css("background-color", "pink");
	//$("input").css("border-color", "lime").css("background-color", "pink");
	
	//$("input[type='button']")
	$("input:button").css({
		"background-color" : "black",
		"color" : "white"
	});
	
	$(":button").css("background-color", "lightblue");
	
	$(":submit").css("background-color", "green");
	$(":reset").css("background-color", "yellow");
	$("text")
	
	
	
});

</script>
</head>
<body>
<form>
	Text : <input type="text"/><br> 
	Password : <input type="password" /><br><br> 
	
	Radio : 
	<input type="radio" name="radioGroup" id="radio" value="A"/> A 
	<input type="radio" name="radioGroup" id="radioß" value="B"/> B <br><br> 
	
	Checkbox : 
	<input type="checkbox" name="checkboxes" id="checkbox1" value="1"/> 1 
	<input type="checkbox" name="checkboxes" id="checkbox2" value="2"/> 2<br><br> 
	
	Textarea : <br> 
	<textarea rows="15" cols="50" id="myTextarea" id="myTextarea"></textarea><br><br>
	 
	Image : <input type="image" src="../../images/image.1.jpg"><br><br> 
	
	File : <input type="file"><br><br> 
	
	Buttons : 
	<button type="button" id="normalButton">Normal</button> 
	<button type="submit" id="submitButton">Submit</button> 
	<button type="reset" id="resetButton">Reset</button> <br><br> 
	
	<input type="button" value="일반버튼"> 
	<input type="submit" value="전송버튼"> 
	<input type="reset" value="초기회버튼"> 
	<br><br>
	 
</form>
</body>
</html>
