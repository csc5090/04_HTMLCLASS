<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<script src="../../js/jqeury-3.7.1.js"></script>

<script>
/* title 속성을 가진 p요소의 배경색 변경 - yellow
 * type 속성이 password인 요소의 테두리 변경 - red
 */
 
 $(function(){
	 $("p[title]").css("background-color", "yellow");
	 $("*[type='password']").css("background-color", "red")
 })

</script>


</head>
<body>
<p> 일반 문단 </p>
<p title="툴팁으로 보입니다">타이틀을 가지고 있는 문단</p>

</body>
</html>
