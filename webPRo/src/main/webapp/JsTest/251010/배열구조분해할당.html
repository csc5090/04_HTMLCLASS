<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>배열구조분해할당</title>
<script>
/* 배열 구조 분해 할당이란?
		배열이나 객체를 분해해서 각각의 값을 개별적인 변수에 저장하는 표현식을 말한다.
		종류 : 배열구조분해할당, 객체구조분해할당
		
		
		1. 배열 구조 분해 할당
			형식1) const 또는 let [변수명1, 변수명2...] = 배열;
				==> '배열' 의 값들이 순서대로 변수에 저장됨.
				==> 변수의 개수보다 배열의 개수가 적으면 값을 차례로 저장하고 나머지는
					 'undefined'가 된다.
			형식2) const 또는 let[변수명1, 변수명2=기본값, ...] = 배열;
				==> 배열에 값이 없을 경우 '기본값'으로 할당한다.
			형식3) const 또는 let [변수명1, 변수명2, ...변수명] = 배열;
				==> '...'을 '스프레드 연산자'라고 한다.(변수명1,2 같은 변수에 모두 할당하고 남은 걸 스프레드 연산자 뒤의 변수를 배열로서 저장.)
				==> 나머지 모든 데이터를 배열로 할당한다.
		
 
 */

 const subjects = ["국어", "영어", "수학"];

 const kor = subjects[0];
 const eng = subjects[1];
 
 console.log("kor", kor);
 console.log("eng", eng);
 console.log("-----------------------")
 //const [kor1, eng1] = subjects;
 
 const [kor1, eng1, mat1] = subjects; 
 console.log("kor1", kor1);
 console.log("eng", eng1);
 console.log("mat1", mat1);
 
 
 //중간 부분의 데이터 할당 생략하기(생략할 부분의 변수를 생략한다.)
 const [kor2, , mat2] = subjects;
 console.log("kor2", kor2);
 console.log("mat2", mat2);
 console.log("----------------------");
 
 //배열의 개수보다 변수의 개수가 많을 때
 const [kor3, eng3, mat3, science3] = subjects;
 console.log("kor3", kor3);
 console.log("eng3", eng3);
 console.log("mat3", mat3);
 console.log("science3", science3);    //undefined
 console.log("----------------------");
 
 const subjects2 = ["국어", "영어", "수학", "과학"];
 
 console.log("subject2", subjects2);
 
 const [kor4, eng4, ...rest] = subjects2;
 
 console.log("kor4", kor4);
 console.log("eng4", eng4);
 console.log("rest", rest);
 console.log("-------------------");
 
 // 변수값 맡교환하기
 
 let a = 100;
 let b = 200;
 
 console.log("변경 전");
 console.log("a", a);
 console.log("b", b);
 
 /* 기존방식
 let temp = a;
 a = b;
 b = temp;
 
 */
 
 //배열 구조 분해 할당 이용
 [a, b] = [b, a];
 console.log("변경 후_구조분해")
 console.log("a", a);
 console.log("b", b);
 console.log("---------------");
 
 //함수에서 반환되는 배열을 구조 분해 할당하기
 
 function getSubjects(){
	 const sub = ["국어", "영어", "수학", "과학"];
	 return sub;
 }
 
 //기존의 방식
 const subArr = getSubjects();
 const kor5 = subArr[0];
 const eng5 = subArr[1];
 const mat5 = subArr[2];
 
 console.log("kor5", kor5);
 console.log("eng5", eng5);
 console.log("mat5", mat5);
 console.log("-----------------------");
 
 //구조분해할당이용
 const [kor6, eng6, mat6] = getSubjects();
 console.log("kor6", kor6);
 console.log("eng6", eng6);
 console.log("mat6", mat6);
 console.log("-------------------");
 
 
 
 
 
</script>
</head>
<body>

</body>
</html>
