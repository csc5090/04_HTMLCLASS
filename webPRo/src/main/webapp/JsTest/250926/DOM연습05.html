<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>

<script>

/*
  	Image 객체 ==> <img>태그를 객체화 한 것
  			  ==> document객체의 하위 객체
  			  ==> 문서에 <img>태그를 사용하면 자바스크립에는 'images'라는 이름의 배열이 자동으로 만들어지고, 이 배열에 Image객체가 순서대로 저장된다.
  		<img src="경로명/파일명.확장자" name="이미지객체이름" 속성들...>
  			  
  		- 자바스크립트에서 Image객체를 사용하는 방법
  		
  		1) images 배열을 이용하는 방법
  		문법) document.images[첨자].속성 및 메서드
  		
  		2) name 속성을 이용하는 방법
  		문법) document.이미지객체이름.속성및메서드
  		
  		3) DOM API의 요소 찾기 메서드를 이용하는 방법
  		
 
 */

function view() {
  			//console.log("src", document.images[0].src);
  			//console.log("src", document.uml.src);
  			//console.log("src", document.images["uml"].src);
  			// console.log("src", document.getElementsByTagName("img")[0].src); // 이런 방법도 있다. 비추.
  			
  			document.uml.border = 10;
  			document.uml.width = 300;
  			document.uml.height = 400;
  			
  			document.uml.src = "../../images/HI.GIF";
  		}
  		

function changeImageToggle() {
	
	 if (document.sw.src.includes("sw_off.jpg")) {
	        document.sw.src = "../../images/sw_on.jpg";
	    } else {
	        document.sw.src = "../../images/sw_off.jpg";
	    }
}

</script>

</head>
<body>

<form>
	<input type="button" value="확인" onclick="view()">
</form>
<br><hr color="red"><br>
<img src="../../images/UML.jpg" name="uml">
<img src="../../images/jQuery.jpg" name="jquery">
<br><hr color="red"><br>

<img src="../../images/sw_off.jpg" name="sw" onclick="changeImageToggle()">

</body>
</html>
