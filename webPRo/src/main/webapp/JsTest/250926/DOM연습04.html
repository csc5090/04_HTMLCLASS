<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<script>


function calc(){
	
	const trList = document.getElementsByTagName("tr");
	
	for(let i=i; i<trList.length; i++){
		const tdList = trList[i].getElementsByTagName("td");
		
		
	let sum = 0;	
	for(let j=2; j<=4; j++){
		sum += Number(tdList[j].textContent);
	}	
	tdList[tdList.length-1].innerHTML = sum;
	}
	
}






function calc() {
	const rows = document.querySelectorAll('table tr');
	
	for (let i = 1; i < rows.length; i++) {
		
		const currentRow = rows[i];
		const cells = currentRow.querySelectorAll('th');
		
		const kor = parseInt(cells[2].textContent);
		const eng = parseInt(cells[3].textContent);
		const math = parseInt(cells[4].textContent);
		
		const total = kor + eng + math;
		
		cells[5].textContent = total;
	}

}

</script>


</head>
<body>
