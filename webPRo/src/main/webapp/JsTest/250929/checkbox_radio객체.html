2) checked ==> 현재 check된 상태이면 true, 그렇지 않으면 false가 됨.

const view = ()=>{

	//document.testForm.city[2].checked = true;

	//document.testForm.city[2].click();
	
	let str = "";
	
	for(let i=0; i<document.testForm.city.length; i++){
		if(document.testForm.city[i].checked){
			str += document.testForm.city[i].value + "\n";
		}
	}
	
	if(str==""){
		alert("check된 항목이 하나도 없음")
	} else {
		alert(str)
	}
	
}

	==> 이런 경우에는 '객체이름'을 배열로 구성해준다.
	
<form name="폼이름">

	<input type="checkbox" name="객체이름" value="값2">
