<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>from객체와 입력요소</title>
<script>
/* 
   form객체와 그 하위 객체들(입력 요소들)
   
1. form객체   ==> <form>태그를 객체화 한 것
         ==> 문서에서 <form>태그를 사용하면 자동으로 forms 라는 이름의 배열이 만들어지고
            이 배열에 차례로 form객체가 저장된다.
   <form name = "폼이름">
      입력요소들...
      <입력요소태그명 name = "입력요소 이름">
   </form>      
   
   - form객체를 자바스크립트로 처리하기
1) document.forms[첨자].속성및메서드
2) document.폼이름.속성및메서드
3) DOM API의 요소를 찾는 메서드 이용

   - form객체의 하위 객체(입력요소)들을 자바스크립트로 처리하기
1) document.forms[첨자].입력요소이름.속성및메서드   
2) document.폼이름.입력요소이름.속성및메서드
3) DOM API의 요소를 찾는 메서드 이용

*/


</script>
</head>

</body>
</html>
