<script>
/*
   정규식(Regular Expression)
      ==> 일정한 패턴을 가지고 있는 문자열을 표현하는 식

- 문자열의 패턴을 나타내는 정규식 문자(정규식에서 특정한 기능을 갖는 문자)
1) ^    ==> 패턴문자의 처음 위치에 올 수 있고, 이것은 문자열의 시작을 의미한다.
   예) ^abc ==> 'abc'로 시작하는 문자열을 의미한다.

2) $   ==> 패턴문자의 맨 마지막 위치에 올 수 있고, 이것은 문자열의 끝을 의미한다.
   예) abc$ ==> 'abc'로 끝나는 문자열을 의미한다.
   
3) .    ==> 이 문자가 있는 위치에는 임의의 1문자가 올 수 있다.
   예) a.b  ==> aab, abb, acb, a1b, ...
   
4) ?   ==> 이 문자의 앞에 있는 문자가 있거나 없거나 한다.(0번 또는 1번 나타난다.)   
   예) ab?c (b가 기준) ==> ac, abc 

5) +   ==> 이 문자의 앞에 있는 문자가 1번 이상 반복한다.
   예) ab+c ==> abc, abbc, abbbc, abbbbbbbbbbbbbbbbc, ...

6) *   ==> 이 문자의 앞에 있는 문자가 0번 이상 반복한다.
   예) ab*c ==> ac, abc, abbbbbc, abbbbbbbbbbbbbbbbc, ...
   
7) |   ==> or 연산자와 같은 기능이다.
   예) abc|xyz ==> abc 또는 xyz

8) ( )   ==> 패턴들 그룹화 한다.
   예) a(b|c)d ==> abd, acd
   
9) [문자들] ==> '문자들' 중 '1문자'를 의미한다.
         ==> '문자들'이 연속해서 순서대로 배치될 때는 '시작문자-끝문자'형태로 나타낸다.
   예) x[abcd]y ==> xay, aby, acy, ady
                x[a-d]y 와 의미가 같다.
   예) [0-9]   ==> 숫자 중 한 문자를 의미한다.
     [A-Za-z]   ==> 영문자 중 한 문자를 의미한다.

10) {숫자} ==> '{}'기호 앞의 문자가 '숫자'만큼 반복한다.
   예) ab{4}c ==> abbbbc
   
   {숫자1, 숫자2}    ==> '{}'기호 앞의 문자가 '숫자1'이상 '숫자2' 이하 만큼 반복한다.
   예) ab{2,4}c  ==> abbc, abbbc, abbbbc
   
   {숫자,}   ==> '{}'기호 앞의 문자가 '숫자'이상 만큼 반복한다.
   예) ab{3,}c   ==> abbbc, abbbbbc, abbbbbbbbc, ...
   
11)   패턴을 미리 정의해 놓은 명령 ==> 정규식의 '클래스 문자'라고 한다.
   (보통 '\문자' 형태로 표현한다.)
   - \d   ==> [0-9]와 같다.
   - \D   ==> '\d'의 반대 개념 (숫자가 아닌 것 중에 1 문자)
   
   - \w   ==> [0-9A-Za-z]와 같다. ==> 알파벳, 숫자 중 1문자
   - \W   ==> '\w'가 아닌 것 중 하나
   
   - \s    ==> 공백문자 (사이띄기, tab문자, 줄바꿈문자, 캐리지리턴) 중 하나
   - \S   ==> '\s'가 아닌 것 중 하나

12) 패턴을 나타내는 문자열에서 '패턴명령문자' 자체를 나타래려면, 
   '패턴명령문자' 앞에 역슬래쉬를 붙힌다.   
   (단,'[]'안에서는 '\'를 사용하지 않는다.)
   예 a\*b      ==> a*b
   예 a[*+-]b   ==> a*b, a+b, a-b
//======================================================
   
- 정규식을 이용하여 패턴을 검사하기
1) 정규식 객체를 생성해서 처리하는 방법
   형식1) const 정규식객체 = new RegExp("패턴문자열", "옵션");
   형식2) const 정규식객체 = new RegExp(/패턴문자열/, "옵션");
   형식1) const 정규식객체 = /패턴문자열/옵션;
                  ==> '패턴문자열'과 '옵션'을 따옴표로 묶지 않는다.
   
   -옵션
   (1) g ==> 전체 영역에서 검색한다.
   (2) i ==> 대소문자 구분없이 검색한다.
   (3) m ==> 여러줄의 내용이 있을 때 '패턴'을 각 줄 단위로 적용한다.
   
   ==> 이 옵션들은 서로 혼용해서 사용할 수 있다.
   예) /패턴문자열/gi ==> 전체 영역에서 대소문자 구분없이 패턴을 검색한다.
   
2) 패턴 검사하기
   - 정규식객체.exec(검사할문자열);
      ==> '검사할문자열'에서 '패턴'에 맞는 문자들을 찾아서 배열에 담아서 반환한다.
      ==> '패턴'에 맞는 것이 없으면 null을 반환한다.
      ==> '패턴'의 옵션과 관계없이 '패턴'에 맞는 첫번째 것을 찾아서 배열에 담아 반환한다.
      
   - 정규식객체.test(검사할문자열);
      ==> '검사할문자열'이 '패턴'에 맞으면 true, 그렇지 않으면 false를 반환한다.
      
   - 검사할문자열.match(패턴문자열 또는 정규식객체);
      ==> '검사할문자열'에서 '패턴'에 맞는 문자들을 찾아서 배열에 담아서 반환한다.
      ==> '패턴'에 맞는 것이 없으면 null을 반환한다.
      ==> 보통 '패턴문자열'의 옵션 중 'g'를 붙이지 않으면 첫번째 찾아진 것 1개를
         배열에 담아서 반환하고, 'g'옵션을 붙이면 '패턴'에 맞는 모든 것들을 찾아 배열에
         담아서 반환한다.
         
   ==> '정규식객체' 대신 '/패턴문자열/옵션'와 같이 정규식을 직접 사용할 수 있다.
