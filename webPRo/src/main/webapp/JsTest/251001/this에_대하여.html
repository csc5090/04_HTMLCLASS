<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<script>
/* 
   자바스크립트의 'this'에 대하여...   

- 자바스크립트에서 this는 '현재의 실행 컨텍스트'를 나타내는 식별자이다.
- this의 값은 함수가 어떻게 호출되었는지에 따라 동적으로 결정한다.
- 이런 부분이 다른 객체 지향 언어의 this와 다른 점이다.

---------------------------------------------------------

- this가 가리키는 대상이 달라지는 경우

1. 전역 컨텍스트에서의 this
   ==> 함수 외부, 즉 전역 스코프에서 this를 사용하면 '전역객체'가 된다
      (전역객체 => 브라우저 환경에서 window객체, Node.js 환경에서는 global 객체)
*/
//console.log(this);      //this ==> 전역객체(window)가 출력된다

/* 
var globalVar = 10;
console.log("globalVar", globalVar);
console.log("window.globalVar", window.globalVar);
console.log("this.globalVar", this.globalVar);

function globalFunc(){
   console.log(this);      //this ==> 전역객체(window)가 출력된다
}

globalFunc(); 
*/
//-----------------------------------------------------------
/* 
2. 함수 호출 방식에 따른 this

1) 일반함수 호출 : 독립적으로 함수가 호출될 때의 this는 '전역객체'를 가리킨다.

function myFunction(){    //function 함수명() 형태로 작성한 함수 ==> 일반 함수
   console.log(this);
}
myFunction();

//-----------------------------------------------------------

2) 메서드 호출 : 객체의 메서드로서 함수가 호출될 때의 this는 해당 메서드를 호출한 객체를 가리킨다.

const myObject ={
   name : "홍길동",
   sayHello : function(){
      console.log(`안녕하세요. 저는${this.name} 입니다.`);
   }
};

myObject.sayHello();   //this ==> myObject 

//-----------------------------------------------------------

3) 생성자 함수 호출 : new 키워드를 사용하여 함수를 호출할 때 (객체를 생성할 때)
            이 때의 this는 생성된 인스턴스 객체를 가리킨다.


function Persin(name){
   this.name = name;
   console.log("새로운 Person 객체 생성 : " + this.name);
}
const person1 = new Persin("홍길동");      // this ==> person1
const person2 = new Persin("이순신");      // this ==> person2

//------------------------------------------------------------

4) call(), apply(), bind()메서드 호출 :
   ==> 이 메서드들을 사용하면 함수를 호출할 때 this 값을 명시적 지정할 수 있다.
   -call(this객체, 인자값들...) :
   -apply(this객체, [인자값들...]) :   // 직접 호출
   
   -bind(this객체, 인자값들...) :      // 새로운 함수가 만들어진다.
   

const person = { name : "홍길동" };
const greeting = function(message, city){
   console.log(this);
   console.log(`${message}, ${city}에 사는 ${this.name}입니다.`);
} 

// greeting("안녕하세요","대전");         //this ==> window
// greeting.call(person,"반갑습니다","서울");   //this ==> preson
//greeting.apply(person,["안녕하세요", "청주"]);

const bindGreeting = greeting.bind(person, "안녕","부산");
bindGreeting();         //this ==> preson
//--------------------------------------------------------------

5) 화살표 함수는 자신만의 this를 설정하지 않는다.
   ==> 화살표 함수 내부의 this는 자신을 둘러싸고 있는 가장 가까운 일반 함수의 this값을
      상속 받는다. (일반함수가 없으면 전역객체를 가리킨다.)   
*/
const myObj = {
   name : "홍길동",
   greet : function(){
      console.log("greet",this);
      setTimeout(function(){
         console.log("일반 함수",this);
         console.log("일반 함수 내부의 this => "+ this.name);
      }, 100);
      
      setTimeout(()=>{
         console.log("화살표 함수",this);
         console.log("화살표 함수 내부의 this = > "+ this.name);
      }, 200);
   }
}

myObj.greet();

</script>
</head>
<body style="background-color: black;">

</body>
</html>
