<script>

/*
 	자바스크립트의 this 에 대하여.
 	
 	- 자바스크립트에서 this는 '현재의 실행 컨텍스트'를 나타내는 식별자이다.
 	- this의 값은 함수가 어떻게 호출되었는지에 따라 동적으로 결정된다.
 	- 이런 부분이 다른 객체 지향 언어의 this와 다른 점이다.
 	
 	-this가 가리키는 대상이 달라지는 경우
 	
 1. 전역 컨텍스트에서의 this
 	==> 함수 외부, 즉 전역 스코프에서 this를 사용하면 '전역 객체'가 된다.
 		(전역 객체 => 브라우저 환경에서 window 객체, Node.js 환경에서는 global 객체)
 
 */
 
// console.log(this);

 function globalFunc() {
	 console.log(this); // this=> 전역 객체 
 }

 globalFunc(); */
 
 /* 
 	2. 함수 호출 방식에 따른 this
 	
 1) 일반함수 호출 : 독립적으로 함수가 호출될 때의 this는 전역 객체를 가리킨다.
 
 function myFunction() { //function 함수명() 형태로 작성한 함수 ==> 일반함수
	 console.log(this);
 }
  
myFunction();


2) 메서드 호출 : 객체의 메서드로서 함수가 호출될 때의 this는 해당 메서드를 호출한 객체를 가리킨다.

const myObject = {
		name : "홍길동",
		sayHello : function(){
			console.log(`안녕하세요. 저는 $[this.name]입니다.`);
		}
};
 
 
 myObject.sayHello();
 
 
 
 3) 생성자 함수 호출 : new 키워드를 사용하여 함수를 호출할 때 (객체를 생성할 때)
 							이 때의 this는 생성된 인스턴스 객체를 가리킨다.
 							

 function Person(name){
	 this.name = name;
	 console.log("새로운 Person 객체 생성 : " + this.name)
 }
 
 const person1 = new Person("홍길동");
 const person2 = new Person("이순신"); 
 

 ------------
 
 
 4) call(), apply(), bind()메서드 호출 : 
	 ==> 이 메서드들을 사용하면 함수를 호출할 때 this 값을 명시적 지정할 수 있다.
	 	- call() 
 
 */
