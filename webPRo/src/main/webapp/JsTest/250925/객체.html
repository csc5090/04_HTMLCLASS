<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>window 객체</title>
<script>
/* 
   BOM(Browser Object Model)    ==> 웹브라우저에서 제공하는 객체
   
window 객체 ==> BOM 중 최상위 객체 
         ==> 'window'라는 이름으로 생성되어 있고,
               이 객체의 맴버들을 사용할 때는 'window'를 생략할 수 있다.
               
- 속성
   opener   ==> 자식 창에서 부모 창을 가리키는 객체(window 객체와 같다.)
   
- 메서드
   1. open()   ==> 새 창을 만들어 준다.
   형식) 
      변수 = window.open("문서명 또는 URL주소", "창이름", "창속성");
         - '창이름'이 같으면 새로운 창이 만들어지지 않고 이미 만들어진
            '창이름'이 같은 창에 내용들이 나타난다.
         - '창속성'은 창의 크기, 새 창이 나타날 위치 등을 지정한다.
            예) "width=400, height=300, left=200, top=100"
         - 지정된 '변수'는 새 창(자식 창)을 가리키는 객체 변수이다.
   2. close()   ==> 창을 닫는다.
   형식) window.close();
       close();
       self.close();      ==> 위의 3가지 명령은 모두 현재 창을 닫아준다.
      
      변수.close();         ==> 부모 창에서 '변수'가 가리키는 자식 창을 닫아준다.
      
   3. 시간변수 = setTimeout(처리할 함수, 시간);
         ==> 주어진 '시간'이 경과하면 '처리할함수'를 실행한다.
         ==> '시간'은 밀리세컨드 단위를 사용한다.
         
         clearTimeout(시간변수);
         ==> setTimeout의 기능을 해제한다.
   
   4. 시간변수 = setInterval(처리할함수, 시간);
         ==> 주어진 '시간'이 경과할 때마다 '처리할함수'를 실행한다.
         ==> '시간'은 밀리세컨드 단위를 사용한다.
         
         clearInterval(시간변수)
         ==>setInterval의 기능을 해제한다.
*/

// 우리가 미리 공부했던 alert(), prompt(), confirm()은 window객체의 메세드이다.

//window.alert("안녕하세요!!");
//alert("안녕하세요???");         

let mywin = null;

function newOpen1(){
   mywin = window.open("subWin.html", "test",
               "width=400, height=300, left=900, top=200"); // 창 크기를 지정해주지 않으면 새 텝에 나온다.
}

function newOpen2(){
   window.open("https://www.daum.net", "",      //창 이름을 "" 으로 지정하면 누를때 마다 여러창을 띄울 수 있다
               "width=400, height=300, left=900, top=200");
}

function closeChild(){
   if(mywin != null){
      mywin.close();      //부모 창에서 자식 창 닫기
      mywin = null;
   } else {
      alert("닫을 자식창이 없습니다.");
   }
}


let time = null;

function timeoutTest(){
	//setTimeout(newOpen1, 3000); 이미 존재하는 함수 호출
	setTimeout(function(){
		window.open("subWin.html", "test", "width=400, height=300, left=400, top=200");
	}, 3000)
}

function intervalTest(){
	time = setInterval( function() {
		window.open("subWin.html", "", "width=400, height=300, left=400, top=200");
	}, 2000);
			
}


function clearTest(){
	clearInterval(time);
}


</script>
</head>
<body>
<form>
<input type="button" value="새창만들기1" onclick="newOpen1()">
<input type="button" value="새창만들기2" onclick="newOpen2()">
<input type="button" value="자식창닫기" onclick="closeChild()">
<input type="button" value="5초후에 새창만들기" onclick="timeoutTest()">
<input type="button" value="2초마다 새창 만들기" onclick="intervalTest()">
<input type="button" value="창만들기 종료" onclick="clearTest()">

</form>
</body>
</html>
