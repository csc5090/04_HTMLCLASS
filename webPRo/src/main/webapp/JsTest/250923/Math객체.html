<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>

<script>

/* 
  	Math 객체 ==> 수학 계산용 객체(정적 객체)
  		
  	
  	-속성
  		Math.PI ==> 3.141592(원주율)
  		Math.E ==> 2.718(오일러 상수)
  		
  		
    -메서드
    	Math.max(값1,2,3,4...); ==> 값들 중에서 제일 큰 값 반환
    	Math.min(값1,2,3,4...); ==> 값들 중에서 제일 작은 값 반환
    	
    	Math.pow(x, y); ==> x의 y승
    	Math.sqrt(값); ==> 값의 제곱근
    	Math.round(값); ==> 값의 소수점 첫째자리에서 반올림
    	
    	Math.floor(값); ==> 값과 같거나 작은 정수들 중에서 제일 큰 값 (값과 같거나 작은 쪽의 정수를 취함)
    	Math.ceil(값); ==> 값과 같거나 큰 정수들 중에서 제일 작은 값(값과 같거나 큰 쪽의 정수를 취함)
    	
    	Math.random(); ==> 자바의 그것. 0이상 1미만 사이의 난수 발생.
    	
    	-최소값 ~ 최대값 사이의 정수형 난수 만들기
    	
    	Math.floor(Math.random() * (최대값 - 최소값 + 1) + 최소값);
    	parseInt(Math.random() * (최대값 - 최소값 + 1) + 최소값);
    	
    	
    	console.log(Math.PI);
    	 console.log(Math.E);
    	 
    	 console.log(Math.max(10, 50, 80, 70));
    	 console.log(Math.min(10, 50, 80, 70));
    	 
    	 console.log(Math.pow(3,4));
    	 console.log(Math.sqrt(25));
    	 console.log(Math.round(123.467));
    	 
    	 console.log(Math.floor(3.4)); // 3,2,1,0,-1....
    	 console.log(Math.floor(-3.4));  // -4,-5,-6
    	 
    	 console.log(Math.ceil(3.4)); // 4,5,6,...
    	 console.log(Math.ceil(-3.4)); // -3,-2,-1,0,...
    	 
    	 console.log(Math.random() ); //랜덤
    	 
    	 //23 ~ 32 사이의 난수 만들기
    	 // let rnd = Math.floor(Math.random() * (32-23+1) + 23);
    	
 */

 
 //1~10사이의 난수를 발생시킨 후 사용자가 값을 맞추는 프로그램  작성
 
 let rnd = Math.floor(Math.random() * (10-1+1) + 1);
 
 let input = prompt("숫자 입력");
 let inputnum = Number(input)
 console.log(rnd);
 
 if(inputnum == rnd) {
	 console.log("정답");
 } else {
	 console.log("ㄲㅂ");
 }
 
 
 const MIN_NUMBER = 1;
 const MAX_NUMBER = 10;
 const SECRET_NUMBER = Math.floor(Math.random() * (MAX_NUMBER - MIN_NUMBER + 1)) + MIN_NUMBER;

 let userGuess = prompt("숫자를 입력하세요.");
 let userGuessNumber = Number(userGuess);

 if (userGuessNumber === SECRET_NUMBER) {
   console.log("정답입니다!");
 } else {
   console.log("아쉽네요. 정답은 " + SECRET_NUMBER + "였습니다.");
 }
 
 

</script>

</head>

</body>
