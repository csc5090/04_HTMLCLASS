<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>date 객체</title>

<script>
/* 
 	-Date 객체
		==> 날짜와 시간을 관리하는 객체
			- 기준날짜 : 1970년 1월 1일 0시 0분 0초(표준시간)
					   1970년 1월 1일 09시 0분 0초(우리나라 시간)
			
			- 밀리세컨드 : 1/1000 초를 의미한다. ( 1000 == 1초 )
					   
 - 객체 생성
   객체 변수 = new Date();
   		  ==> 현재 날짜 및 현재 시간으로 구성된 Date객체 생성
   객체 변수 = new Date( 밀리세컨드값 );
   		  ==> 기준날짜로 부터 주어진 '밀리세컨드값'만큼 경과한 날짜 및 시간으로 구성된
   		  	  Date객체 생성
   		  	  
    객체 변수 = new Date(날짜형식의 문자열)
   		 ==> 주어진 날짜로 구성된 Date 객체 생성
   	객체 변수 = new Date(년, 월-1, 일, 시, 분, 초);
   		  ==> 주어진 날짜 및 시간으로 구성된 Date객체 생성 (일,시,분,초)는 생략 가능
   		  ==> Date객체의 '월'은 0이 1월, 1이 2월, .., 11이 12월로 처리됨.
   		  
   	
 = 메서드
 1) Date객체에 설정된 정보를 읽어오는 메서드들 (get을 시작하는 메서드들)
 	- getFullYear()  ==> 년도 반환
 	- getMonth() + 1 ==> 월 반환
 	- getDate()      ==> 일 반환
 	- getDay() 		 ==> 요일 반환
 	- getHours()     ==> 시 반환
 	- getMinutes()   ==> 분 반환
 	- getSeconds()   ==> 초 반환
 	= getTime()      ==> 기준날짜로부터 'Date객체'에 설정된 날짜 및 시간까지 경과한 시간을 밀리세컨드 단위의 값으로 반환
 	
 	
   	const testDay = new Date(1970, 0, 1, 9, 0, 35);
 console.log("getTime() ==> " + testDay.getTime());
 
 let y = testDay.getFullYear();
 let m = testDay.getMonth() + 1;
 let d = testDay.getDate();
 let w = testDay.getDay();
 
 console.log(`${y}년 ${m}월 ${d}일` );
 
 let week = "";
 
 switch(w){
 	case 0 : week = "일요일"; break;
 	case 1 : week = "월요일"; break;
 	case 2 : week = "화요일"; break;
 	case 3 : week = "수요일"; break;
 	case 4 : week = "목요일"; break;
 	case 5 : week = "금요일"; break;
 	case 6 : week = "토요일"; break;
 }
 
 console.log("요일 : " + week);
 
 
 2) Date객체에 설정된 값을 변경하는 메서드들(set으로 시작하는 메서드들)
 	- setYear(새로운년도);  => 년도 변경
 	- setMonth(월-1);   -> 월 변경
 	- setDate(일)    => 일 변경
 	- setHours(시)    => 시 변경
 	- setMunute(분);    => 분 변경
 	- setSeconds(초);	=> 초 변경
 	- setTime(경과시간);	=> '기준날짜'로부터 주어진 '경과시간'만큼 경과한 날짜 및 시간으로 'Date객체'의 정보를 재설정함.
 							(경과시간은 밀리세컨드 단위)
 							
 							
 3) 날짜와 시간 정보를 반환하는 메서드
 	- toGMTString()    ==> 표준시간을 기준으로 날짜와 시간을 반환
 	- toLocalString()    ==> 해당 지역의 시간을 기준으로 날짜와 시간 반환
 	- toString()    ==> 표준시간과 지역시간의 관계도 반환한다.
 	
 	const testDay = new Date();
 	console.log("toGMTString => " + testDay.toGMTString());
 	console.log("toLocalString => " + testDay.toLocalString());
 	console.log("toString => " + testDay.toString());
 	
 	testDay.setYear(2000);
 	console.log("toLocaleString => " + testDay.toLocaleString() );
 	
 	testDay.setTime(100000);
 	console.log("toLocaleString => " + testDay.toLocaleString() );
 	
 	

 	
 	
 	
 	
 	
 	
 */
 //문제) 2010년 1월 1일부터 오늘까지의 날짜 수를 계산하는 코드 작성
 
 const first = new Date(2010, 0, 1, 0, 0, 0);
 const second = new Date;
 
 let s = second.getTime() - first.getTime();
 
 let days = Math.ceil(s / (24 * 60 * 60 * 1000));
 
 console.log("날짜수 : " + days + "일");
 
 
 
 //문제) 오늘부터 500일 후의 날짜를 출력하는 코드 작성

 let d = testDay.getDate();
 
 console.log(y + "년" + m + "월"+ d + "일");
 
 
 
</script>
